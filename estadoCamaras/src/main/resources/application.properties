spring.application.name=estadoCamaras
# URL de conexión a MySQL (cambia 'mi_base_de_datos' por el nombre de tu BD)
spring.datasource.url=${DB_URL}

# Usuario de MySQL
spring.datasource.username=${DB_USERNAME}

# Contraseña de MySQL
spring.datasource.password=${DB_PASSWORD}

# Driver de la base de datos
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#telegram
#notificaciones.canal=telegram
notificaciones.telegram.token=${TELEGRAM_TOKEN}
notificaciones.telegram.chat-id=${TELEGRAM_CHAT_ID}

#whatsapp
notificaciones.canal=whatsapp
notificaciones.whatsapp.token=${WHATSAPP_TOKEN}
notificaciones.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID}
notificaciones.whatsapp.destino=${WHATSAPP_DESTINO}
#notificaciones.whatsapp.plantilla=alerta_camara
notificaciones.whatsapp.api-version=v25.0
notificaciones.whatsapp.plantilla=hello_world
notificaciones.whatsapp.idioma=en_US

